<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Gradiente do céu (verde florestal) -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#0d3d2a"/>
      <stop offset="50%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <!-- Halo dourado ao redor do sol -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFD700" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <!-- Gradiente das árvores -->
    <linearGradient id="treeDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a2818"/>
      <stop offset="100%" stop-color="#031008"/>
    </linearGradient>
    <!-- Brilho das letras -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Céu -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Estrelas -->
  <g fill="#FFFFFF">
    <circle cx="80"  cy="70"  r="1.5" opacity="0.75"/>
    <circle cx="190" cy="130" r="1"   opacity="0.55"/>
    <circle cx="320" cy="60"  r="1.6" opacity="0.85"/>
    <circle cx="470" cy="100" r="1"   opacity="0.6"/>
    <circle cx="620" cy="80"  r="1.4" opacity="0.7"/>
    <circle cx="730" cy="150" r="1"   opacity="0.55"/>
    <circle cx="55"  cy="200" r="1"   opacity="0.6"/>
    <circle cx="220" cy="230" r="1.5" opacity="0.5"/>
    <circle cx="755" cy="230" r="1"   opacity="0.55"/>
    <circle cx="430" cy="180" r="1.2" opacity="0.7"/>
    <circle cx="280" cy="170" r="1"   opacity="0.55"/>
    <circle cx="560" cy="200" r="1"   opacity="0.5"/>
  </g>

  <!-- Halo do sol -->
  <circle cx="400" cy="290" r="300" fill="url(#sunGlow)"/>
  <!-- Sol -->
  <circle cx="400" cy="290" r="75" fill="#FFD700"/>
  <circle cx="400" cy="290" r="92" fill="#FFD700" opacity="0.25"/>

  <!-- Montanhas distantes -->
  <polygon points="0,560 130,420 250,510 400,360 540,490 680,400 800,470 800,800 0,800"
           fill="#1B3A1F" opacity="0.7"/>
  <!-- Montanhas próximas -->
  <polygon points="0,640 110,520 230,600 370,480 510,580 650,500 800,560 800,800 0,800"
           fill="#0a2818" opacity="0.9"/>

  <!-- Árvores à esquerda -->
  <g fill="url(#treeDark)">
    <polygon points="0,800 50,500 100,800"/>
    <polygon points="10,800 50,470 90,800"/>
    <polygon points="20,800 50,440 80,800"/>
    <rect x="44" y="640" width="12" height="160"/>

    <polygon points="100,800 145,540 190,800"/>
    <polygon points="110,800 145,510 180,800"/>
    <rect x="140" y="650" width="10" height="150"/>

    <polygon points="210,800 248,560 286,800"/>
    <rect x="242" y="660" width="12" height="140"/>
  </g>

  <!-- Árvores à direita -->
  <g fill="url(#treeDark)">
    <polygon points="510,800 555,540 600,800"/>
    <polygon points="520,800 555,510 590,800"/>
    <rect x="550" y="650" width="10" height="150"/>

    <polygon points="610,800 660,490 710,800"/>
    <polygon points="620,800 660,460 700,800"/>
    <polygon points="630,800 660,430 690,800"/>
    <rect x="654" y="640" width="12" height="160"/>

    <polygon points="725,800 765,560 805,800"/>
    <rect x="759" y="660" width="12" height="140"/>
  </g>

  <!-- Solo -->
  <rect x="0" y="760" width="800" height="40" fill="#020a05"/>

  <!-- Painel decorativo atrás do texto -->
  <rect x="110" y="330" width="580" height="240" rx="28"
        fill="#0a2818" opacity="0.4"
        stroke="#FFD700" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Sombra do texto -->
  <text x="404" y="488" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="135" font-weight="bold" font-style="italic"
        fill="#000000" opacity="0.55">Em breve!</text>

  <!-- Texto principal com letras coloridas -->
  <text x="400" y="482" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="135" font-weight="bold" font-style="italic"
        xml:space="preserve" filter="url(#glow)"><tspan fill="#7CB342">E</tspan><tspan fill="#FFD700">m</tspan><tspan dx="22" fill="#FFFFFF"> </tspan><tspan fill="#A1887F">b</tspan><tspan fill="#42A5F5">r</tspan><tspan fill="#7CB342">e</tspan><tspan fill="#FFD700">v</tspan><tspan fill="#A1887F">e</tspan><tspan fill="#FF7043">!</tspan></text>

  <!-- Subtítulo -->
  <text x="400" y="538" text-anchor="middle"
        font-family="Georgia, serif"
        font-size="20" fill="#FFFFFF" opacity="0.75"
        letter-spacing="6">FIQUE ATENTO</text>

  <!-- Pequenos brilhos decorativos -->
  <g fill="#FFD700" opacity="0.6">
    <circle cx="155" cy="365" r="2"/>
    <circle cx="645" cy="365" r="2"/>
    <circle cx="155" cy="535" r="2"/>
    <circle cx="645" cy="535" r="2"/>
  </g>
</svg>
