<script>
  
  /*
  * ==========================================================
  * CONFIGURAÇÃO
  * ==========================================================
  *
  * TROQUE SOMENTE ESTE VALOR:
  *
  * SEU_ID_DA_PLANILHA
  *
  * Exemplo:
  *
  * 1AbCdEfGhIjKlMnOpQrStUvWxYz123456789
  *
  */
  
  const GOOGLE_SHEET_ID = "1D9_vR0xIGVcu0GqBDLFXyg7UtLJ4VCLgr-48leUfAAk";
  
  /*
  * Nome da aba no Google Sheets
  */
  
  const GOOGLE_SHEET_NAME = "Expedicoes";
  
  
  /*
  * URL utilizada para obter os dados da planilha.
  *
  * A planilha precisa estar publicada/disponível na web.
  */
  
  const SHEET_URL =
  `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(GOOGLE_SHEET_NAME)}`;
  
  
  /*
  * ==========================================================
  * FUNÇÕES AUXILIARES
  * ==========================================================
  */
  
  
  function escapeHTML(value) {
    
    if (value === null || value === undefined) {
      return "";
    }
    
    return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
    
  }
  
  
  /*
  * Converte links comuns do Google Drive para uma URL
  * que normalmente funciona melhor no elemento <img>.
  *
  * Aceita, por exemplo:
  *
  * https://drive.google.com/file/d/ID/view
  *
  * ou
  *
  * https://drive.google.com/open?id=ID
  */
  
  function convertDriveImageURL(url) {
    
    if (!url) {
      return "";
    }
    
    url = String(url).trim();
    
    /*
    * Arquivo do Drive:
    */
    
    let match = url.match(
    /drive\.google\.com\/file\/d\/([^/]+)/
    );
    
    if (match && match[1]) {
      
      return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1600`;
      
    }
    
    
    /*
    * Link com ?id=
    */
    
    match = url.match(
    /drive\.google\.com\/.*[?&]id=([^&]+)/
    );
    
    if (match && match[1]) {
      
      return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w1600`;
      
    }
    
    
    /*
    * Caso já seja uma URL normal:
    */
    
    return url;
  }
  
  
  /*
  * Permite que a imagem seja carregada mesmo se houver
  * espaços ou caracteres especiais.
  */
  
  function getImageURL(url) {
    
    const converted = convertDriveImageURL(url);
    
    return escapeHTML(converted);
  }
  
  
  /*
  * Cria as estrelas da avaliação.
  *
  * Exemplo:
  * nota = 5
  */
  
  function createStars(nota) {
    
    const rating = Number(nota) || 0;
    
    let html = "";
    
    for (let i = 1; i <= 5; i++) {
      
      html += `
          <span
            class="material-symbols-outlined text-sm"
            style="font-variation-settings: 'FILL' 1;">
            ${i <= Math.round(rating) ? "star" : "star_border"}
          </span>
        `;
    }
    
    return html;
  }
  
  
  /*
  * ==========================================================
  * LEITOR CSV
  * ==========================================================
  *
  * O Google Sheets devolve os dados como CSV.
  *
  * Esta função trata:
  *
  * - vírgulas;
  * - aspas;
  * - textos com quebra de linha;
  * - células vazias.
  */
  
  function parseCSV(text) {
    
    const rows = [];
    
    let row = [];
    
    let value = "";
    
    let insideQuotes = false;
    
    
    for (let i = 0; i < text.length; i++) {
      
      const char = text[i];
      
      const next = text[i + 1];
      
      
      if (char === '"' && insideQuotes && next === '"') {
        
        value += '"';
        
        i++;
        
        continue;
      }
      
      
      if (char === '"') {
        
        insideQuotes = !insideQuotes;
        
        continue;
      }
      
      
      if (char === "," && !insideQuotes) {
        
        row.push(value);
        
        value = "";
        
        continue;
      }
      
      
      if (
      (char === "\n" || char === "\r") &&
      !insideQuotes
      ) {
        
        if (char === "\r" && next === "\n") {
          i++;
        }
        
        row.push(value);
        
        rows.push(row);
        
        row = [];
        
        value = "";
        
        continue;
      }
      
      
      value += char;
    }
    
    
    if (value !== "" || row.length > 0) {
      
      row.push(value);
      
      rows.push(row);
    }
    
    
    return rows;
  }
  
  
  /*
  * ==========================================================
  * TRANSFORMA CSV EM OBJETOS
  * ==========================================================
  */
  
  function csvToObjects(csv) {
    
    const rows = parseCSV(csv);
    
    if (!rows.length) {
      return [];
    }
    
    
    const headers = rows[0].map(header =>
    header
    .trim()
    .toLowerCase()
    );
    
    
    return rows
    .slice(1)
    .filter(row =>
    row.some(cell => String(cell).trim() !== "")
    )
    .map(row => {
      
      const object = {};
      
      headers.forEach((header, index) => {
        
        object[header] =
        row[index] !== undefined
        ? row[index].trim()
        : "";
        
      });
      
      return object;
    });
  }

        <!-- IMAGEM -->

        <div class="relative group">

          <div
            class="scrapbook-tape -top-4 -left-4 scrapbook-rotate-left">
          </div>

          <div
            class="scrapbook-tape -bottom-4 -right-4 scrapbook-rotate-right">
          </div>


          <div
            class="p-sm bg-white border-2 border-stone-800 rounded-lg shadow-lg group-hover:rotate-1 transition-transform duration-300">

            ${
    imagem
    ? `
                <img
                  alt="${alt}"
                  class="w-full aspect-square object-cover rounded-md"
                  src="${imagem}"
                  onerror="this.style.display='none';"
                />
              `
    : `
                <div
                  class="w-full aspect-square flex items-center justify-center bg-surface-container">

        </div>

      `;
  }
  
  
  /*
  * ==========================================================
  * RENDERIZA UM CARD
  * ==========================================================
  */
  
  function renderCard(expedicao, index) {
    
    const id =
    `details-${expedicao.id || index}`;
    
    
    const nome =
    expedicao.nome ||
    "Expedição cultural";
    
    
    const imagem =
    getImageURL(expedicao.imagem);
    
    
    const alt =
    escapeHTML(
    expedicao.alt_imagem ||
    nome
    );
    
    
    const nota =
    expedicao.nota ||
    "0";
    
    
    const resumo =
    expedicao.resumo ||
    "";
    
    
    const tituloDetalhes =
    expedicao.titulo_detalhes ||
    nome;
    
    
    const descricaoDetalhes =
    expedicao.descricao_detalhes ||
    "";
    
    
    const topicos = [
    expedicao.topico_1,
    expedicao.topico_2,
    expedicao.topico_3
    ].filter(Boolean);
    
    
    const conclusao =
    expedicao.conclusao ||
    "";
    
    
    const link =
    expedicao.link ||
    "";
    
    
    const textoLink =
    expedicao.texto_link ||
    "Saiba mais";
    
    
    const linkHTML =
    link
    ? `
            <a
              href="${escapeHTML(link)}"
              target="_blank"
              rel="noopener noreferrer"
              class="inline-block mt-md w-fit px-md py-xs bg-surface-variant text-on-surface-variant font-button text-button rounded-lg border-2 border-outline hover:bg-outline-variant transition-colors">

              ${escapeHTML(textoLink)}

            </a>
          `
    : `
            <button
              type="button"
              class="dropdown-toggle mt-md w-fit px-md py-xs bg-surface-variant text-on-surface-variant font-button text-button rounded-lg border-2 border-outline hover:bg-outline-variant transition-colors"
              aria-expanded="false"
              aria-controls="${id}"
              data-target="${id}">

              Saiba mais

            </button>
          `;
    
    
    return `

        <article
          class="flex flex-col md:flex-row bg-surface-container-low border-2 border-outline-variant rounded-xl overflow-hidden hover:shadow-md transition-all group">


          <!-- IMAGEM -->

          <div
            class="w-full md:w-72 h-48 md:h-auto overflow-hidden">

            ${
    imagem
    ? `
                <img
                  alt="${alt}"
                  class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                  src="${imagem}"
                  onerror="this.style.display='none';"
                />
              `
    : `
                <div
                  class="w-full h-full min-h-48 flex items-center justify-center bg-surface-container">
                  Sem imagem
                </div>
              `
    }

          </div>


          <!-- CONTEÚDO -->

          <div
            class="p-md flex-1 flex flex-col justify-between">

            <div>

              <div
                class="flex justify-between items-start gap-4">


                <!-- NOME -->

                <h4
                  class="font-headline-md text-headline-md text-on-surface mb-xs">

                  ${escapeHTML(nome)}

                </h4>


                <!-- NOTA -->

                <div
                  class="flex text-secondary items-center shrink-0">

                  ${createStars(nota)}

                  <span
                    class="ml-xs font-label-lg text-label-lg">

                    ${escapeHTML(nota)}

                  </span>

                </div>

              </div>


              <!-- RESUMO -->

              <p
                class="font-body-sm text-body-sm text-on-surface-variant line-clamp-2">

                ${escapeHTML(resumo)}

              </p>

            </div>


            <!-- BOTÃO -->

            ${linkHTML}


            <!-- DETALHES -->

            ${
    link
    ? ""
    : `
                <div
                  id="${id}"
                  class="hidden mt-md p-md bg-surface-container-high rounded-xl border border-outline-variant text-body-sm text-on-surface-variant">


                  ${
    imagem
    ? `
                      <img
                        src="${imagem}"
                        alt="${alt}"
                        class="details-image float-left w-52 h-52 mr-4 rounded-xl border-2 border-stone-300 object-cover"
                      />
                    `
    : ""
    }


                  <div class="space-y-3">

                    <h5
                      class="font-headline-md text-headline-md text-on-surface">

                      ${escapeHTML(tituloDetalhes)}

                    </h5>


                    <p>
                      ${escapeHTML(descricaoDetalhes)}
                    </p>


                    ${
    topicos.length
    ? `
                        <ul
                          class="list-disc list-inside space-y-2 text-body-sm text-on-surface-variant">

                          ${topicos.map(topico => `
                            <li>
                              ${escapeHTML(topico)}
                            </li>
                          `).join("")}

                        </ul>
                      `
    : ""
    }

                  </div>


                  ${
    conclusao
    ? `
                      <div
                        class="mt-4 border-t border-outline-variant pt-4 clear-left">

                        <p>
                          ${escapeHTML(conclusao)}
                        </p>

                      </div>
                    `
    : ""
    }


                </div>
              `
    }


          </div>

        </article>

      `;
  }
  
  
  /*
  * ==========================================================
  * RENDERIZA SAÍDAS ANTERIORES
  * ==========================================================
  */
  
  function renderSaidasAnteriores(expedicoes) {
    
    const container =
    document.getElementById("saidas-anteriores");
    
    
    if (!expedicoes.length) {
      
      container.innerHTML = `
          <div
            class="p-8 text-center bg-surface-container-low border-2 border-outline-variant rounded-xl">

            Nenhuma expedição anterior cadastrada.

          </div>
        `;
      
      return;
    }
    
    
    container.innerHTML =
    expedicoes
    .map((expedicao, index) =>
    renderCard(expedicao, index)
    )
    .join("");
    
    
    setupDropdowns();
  }
  
  
  /*
  * ==========================================================
  * BOTÕES "SAIBA MAIS"
  * ==========================================================
  */
  
  function setupDropdowns() {
    
    document
    .querySelectorAll(".dropdown-toggle")
    .forEach(button => {
      
      button.addEventListener("click", () => {
        
        const targetId =
        button.getAttribute("data-target");
        
        
        const target =
        document.getElementById(targetId);
        
        
        if (!target) {
          return;
        }
        
        
        const isHidden =
        target.classList.contains("hidden");
        
        
        /*
        * Fecha os demais:
        */
        
        document
        .querySelectorAll(
        '[id^="details-"]'
        )
        .forEach(element => {
          
          element.classList.add("hidden");
          
        });
        
        
        document
        .querySelectorAll(".dropdown-toggle")
        .forEach(otherButton => {
          
          otherButton.setAttribute(
          "aria-expanded",
          "false"
          );
          
        });
        
        
        /*
        * Abre o escolhido:
        */
        
        if (isHidden) {
          
          target.classList.remove("hidden");
          
          button.setAttribute(
          "aria-expanded",
          "true"
          );
          
        }
        
      });
      
    });
    
  }
  
  
  /*
  * ==========================================================
  * CARREGAMENTO DA PLANILHA
  * ==========================================================
  */
  
  async function carregarExpedicoes() {
    
    const proximaContainer =
    document.getElementById(
    "proxima-expedicao"
    );
    
    
    const anterioresContainer =
    document.getElementById(
    "saidas-anteriores"
    );
    
    
    /*
    * Verificação do ID:
    */
    
    if (
    !GOOGLE_SHEET_ID ||
    GOOGLE_SHEET_ID !== "1D9_vR0xIGVcu0GqBDLFXyg7UtLJ4VCLgr-48leUfAAk"
    ) {
      
      proximaContainer.innerHTML = `
          <div class="md:col-span-2">

            <div class="error-message">

              <strong>
                Planilha ainda não configurada.
              </strong>

              <br><br>

              Abra o arquivo
              <strong>expedicoes.html</strong>
              e substitua:

              <br><br>

              <code>
                SEU_ID_DA_PLANILHA
              </code>

              <br><br>

              pelo ID da sua planilha do Google Sheets.

            </div>

          </div>
        `;
      
      
      anterioresContainer.innerHTML = "";
      
      return;
    }
    
    
    try {
      
      const response =
      await fetch(SHEET_URL);
      
      
      if (!response.ok) {
        
        throw new Error(
        "Não foi possível acessar a planilha."
        );
        
      }
      
      
      const csv =
      await response.text();
      
      
      const expedicoes =
      csvToObjects(csv);
      
      
      /*
      * Filtra somente registros ativos.
      */
      
      const ativas =
      expedicoes.filter(expedicao => {
        
        const ativo =
        String(expedicao.ativo || "")
        .trim()
        .toUpperCase();
        
        return (
        ativo === "" ||
        ativo === "SIM" ||
        ativo === "TRUE" ||
        ativo === "1"
        );
        
      });
      
      
      /*
      * Procura a próxima expedição:
      */
      
      const proxima =
      ativas.find(expedicao =>
      String(expedicao.tipo || "")
      .trim()
      .toLowerCase() === "proxima"
      );
      
      
      /*
      * Procura as anteriores:
      */
      
      const anteriores =
      ativas.filter(expedicao =>
      String(expedicao.tipo || "")
      .trim()
      .toLowerCase() === "anterior"
      );
      
      
      renderProximaExpedicao(proxima);
      
      renderSaidasAnteriores(anteriores);
      
    }
    
    
    catch (error) {
      
      console.error(
      "Erro ao carregar Google Sheets:",
      error
      );
      
      
      proximaContainer.innerHTML = `
          <div class="md:col-span-2">

            <div class="error-message">

              <strong>
                Não foi possível carregar as expedições.
              </strong>

              <br><br>

              Verifique se a planilha está publicada
              na web e se o ID da planilha está correto.

              <br><br>

              Erro:
              ${escapeHTML(error.message)}

            </div>

          </div>
        `;
      
      
      anterioresContainer.innerHTML = "";
      
    }
    
  }
  
  
  /*
  * ==========================================================
  * INICIALIZAÇÃO
  * ==========================================================
  */
  
  document.addEventListener(
  "DOMContentLoaded",
  carregarExpedicoes
  );
  
</script>
